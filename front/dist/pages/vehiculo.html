<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del auto</title>

    <!-- 1. Aquí va el CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css"> <!-- css escritorio: sube a dist/ y entra a css/ -->
    <link rel="stylesheet" href="../css/mobile.css"> <!-- css mobile -->
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/front/index.html">Automotora</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="/front/index.html">Listado</a>
                    <a class="nav-link" href="./agregar.html">Agregar auto</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <h1 class="h3" id="titulo">Vehículo</h1>
        <p class="text-muted">Datos del auto y formulario para modificarlos.</p>

        <div id="aviso" class="alert d-none" role="alert"></div>

        <div class="row g-4">
            <div class="col-lg-5">
                <table class="table">
                    <tbody id="ficha"></tbody>
                </table>
            </div>
            <div class="col-lg-7">
                <form id="formulario" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Marca</label>
                        <select class="form-select" name="id_marca" required>
                            <option value="">Elegí una marca</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Modelo</label>
                        <input class="form-control" name="modelo" required maxlength="50">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Año</label>
                        <input class="form-control" name="anio" type="number" min="1950" max="2100">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Precio</label>
                        <input class="form-control" name="precio" type="number" min="0" step="0.01">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <select class="form-select" name="estado" required>
                            <option value="">Elegí un estado</option>
                            <option value="Nuevo">Nuevo</option>
                            <option value="Usado">Usado</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Guardar cambios</button>
                        <a class="btn btn-outline-secondary" href="/front/index.html">Volver al listado</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="container py-3 text-muted">
        <small>Tarea 13 — Luis Rodriguez</small>
    </footer>

    <!-- 2. Aquí va el JavaScript de Bootstrap (Justo antes de cerrar el body) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/api.js"></script>
    <script src="../js/vehiculo.js"></script>
</body>
</html>
